<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Laboratorio 07 - Arquitectura de microservicios: Inventario de almacen</text>

  <!-- Cliente -->
  <rect x="350" y="62" width="200" height="56" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Cliente REST</text>
  <text x="450" y="106" text-anchor="middle" font-size="12" fill="#475569">Postman (JSON / HTTP)</text>

  <!-- flechas cliente -> servicios -->
  <line x1="400" y1="118" x2="160" y2="186" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="450" y1="118" x2="450" y2="186" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="118" x2="740" y2="186" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="232" y="146" font-size="11" fill="#475569">/api/proveedores</text>
  <text x="458" y="160" font-size="11" fill="#475569">/api/productos</text>
  <text x="602" y="146" font-size="11" fill="#475569">/api/movimientos</text>

  <!-- Servicios -->
  <g>
    <rect x="40" y="190" width="240" height="150" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="160" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">ms-proveedor</text>
    <text x="160" y="238" text-anchor="middle" font-size="12" fill="#065f46">Puerto 8082</text>
    <text x="160" y="264" text-anchor="middle" font-size="11" fill="#334155">Controller → Service → Repository</text>
    <text x="160" y="284" text-anchor="middle" font-size="11" fill="#334155">DTO + Bean Validation</text>
    <text x="160" y="304" text-anchor="middle" font-size="11" fill="#334155">CRUD de proveedores</text>
    <text x="160" y="324" text-anchor="middle" font-size="11" fill="#334155">@RestControllerAdvice</text>
  </g>
  <g>
    <rect x="330" y="190" width="240" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="450" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">ms-producto</text>
    <text x="450" y="238" text-anchor="middle" font-size="12" fill="#1e40af">Puerto 8081</text>
    <text x="450" y="264" text-anchor="middle" font-size="11" fill="#334155">Controller → Service → Repository</text>
    <text x="450" y="284" text-anchor="middle" font-size="11" fill="#334155">DTO + Bean Validation</text>
    <text x="450" y="304" text-anchor="middle" font-size="11" fill="#334155">CRUD de productos</text>
    <text x="450" y="324" text-anchor="middle" font-size="11" fill="#334155">@RestControllerAdvice</text>
  </g>
  <g>
    <rect x="620" y="190" width="240" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="740" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">ms-movimiento</text>
    <text x="740" y="238" text-anchor="middle" font-size="12" fill="#9a3412">Puerto 8083</text>
    <text x="740" y="264" text-anchor="middle" font-size="11" fill="#334155">Controller → Service → Repository</text>
    <text x="740" y="284" text-anchor="middle" font-size="11" fill="#334155">Entradas / salidas (cantidad &gt; 0)</text>
    <text x="740" y="304" text-anchor="middle" font-size="11" fill="#334155">Stock = Σ entradas − Σ salidas</text>
    <text x="740" y="324" text-anchor="middle" font-size="11" fill="#334155">@RestControllerAdvice</text>
  </g>

  <!-- flechas servicio -> BD -->
  <line x1="160" y1="340" x2="160" y2="394" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="450" y1="340" x2="450" y2="394" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="740" y1="340" x2="740" y2="394" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="168" y="372" font-size="11" fill="#475569">JPA / Hibernate</text>
  <text x="458" y="372" font-size="11" fill="#475569">JPA / Hibernate</text>
  <text x="748" y="372" font-size="11" fill="#475569">JPA / Hibernate</text>

  <!-- Bases de datos (cilindros) -->
  <g>
    <path d="M80,410 a80,14 0 0,0 160,0 v70 a80,14 0 0,1 -160,0 z" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="160" cy="410" rx="80" ry="14" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
    <text x="160" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">bd_proveedor</text>
    <text x="160" y="470" text-anchor="middle" font-size="11" fill="#065f46">tabla: proveedores</text>
  </g>
  <g>
    <path d="M370,410 a80,14 0 0,0 160,0 v70 a80,14 0 0,1 -160,0 z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <ellipse cx="450" cy="410" rx="80" ry="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="450" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">bd_producto</text>
    <text x="450" y="470" text-anchor="middle" font-size="11" fill="#1e40af">tabla: productos</text>
  </g>
  <g>
    <path d="M660,410 a80,14 0 0,0 160,0 v70 a80,14 0 0,1 -160,0 z" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <ellipse cx="740" cy="410" rx="80" ry="14" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <text x="740" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">bd_movimiento</text>
    <text x="740" y="470" text-anchor="middle" font-size="11" fill="#9a3412">tabla: movimientos</text>
  </g>

  <!-- referencias logicas -->
  <path d="M370,445 Q305,425 240,445" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <path d="M660,445 Q595,425 530,445" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="305" y="510" text-anchor="middle" font-size="11" fill="#64748b">productos.proveedor_id</text>
  <text x="595" y="510" text-anchor="middle" font-size="11" fill="#64748b">movimientos.producto_id</text>
  <text x="450" y="540" text-anchor="middle" font-size="12" fill="#64748b">Línea punteada = referencia lógica por ID (sin llave foránea física entre bases). MySQL 8 · XAMPP</text>
</svg>
